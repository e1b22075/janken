<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
</head>

<body>
  <script th:inline="javascript" th:if="${score}">
    window.onload = function () {
      var score = [[${ score }]];
      var result_txt = "";
      if (score == 'Gu') {
        result_txt = "あなたの手 " + score + "<br>相手の手 Gu" + "<br>結果 あいこ";
      }
      else if (score == 'Choki') {
        result_txt = "あなたの手 " + score + "<br>相手の手 Gu" + "<br>結果 You Win";
      }
      else if (score == 'Pa') {
        result_txt = "あなたの手 " + score + "<br>相手の手 Gu" + "<br>結果 You Lose";
      }


      //DOM操作
      document.getElementById("result").innerHTML = result_txt;
      console.log(score);//ログ出力．ブラウザのコンソール画面に表示される
    }
  </script>
  <a href="/logout">ログアウト</a>
  <h1>Match</h1>
  <h2>
    <p>
    <div th:if="${login_user}">[[${login_user}]]</div> V.S. <div th:if="${user}">[[${user.name}]]</div>
    </p>
  </h2>
  <p>
    <a th:href="@{/fight(id=${user.id}, you='Gu')}">ぐー</a>
    <a th:href="@{/fight(id=${user.id}, you='Choki')}">ちょき</a>
    <a th:href="@{/fight(id=${user.id}, you='Pa')}">ぱー</a>




  </p>
  <a href="/janken">もどる</a>
  <div th:if="${score}">
    <span id="result">
      ほげほげ
    </span>
  </div>
</body>
