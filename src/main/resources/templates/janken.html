<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
</head>

<body>

  <a href="/logout">ログアウト</a>
  <h1>じゃんけんゲーム‼</h1>
  <div th:if="${user}">
    <h2>エントリー</h2>
    <ul>
      <li th:each="user : ${user}"><a th:href="@{/match(id=${user.id} + 1)}"> [[${user.name}]]</a></li>
    </ul>
  </div>
  <h2>試合結果</h2>
  <div th:if="${match}">

    <ul>
      <li th:each="match : ${match}">
        id:[[${match.id}]] user1:[[${match.user1}]] user2:[[${match.user2}]] user1の手:[[${match.user1Hand}]]
        user2の手:[[${match.user2Hand}]]
      </li>
    </ul>

</body>
